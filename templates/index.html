<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DML Watermark Cleaner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<header><h1>DML Watermark Cleaner ✅</h1></header>

<div class="tabs">
  <button id="imgTab" class="active">🖼 Remove Image Watermark</button>
  <button id="vidTab">🎥 Remove Video Watermark</button>
</div>

<div id="status" class="status"></div>

<!-- IMAGE PANEL -->
<div id="imagePanel">
  <input type="file" id="imgFile" accept="image/*">
  <canvas id="imgCanvas" class="canvas"></canvas>
  <div class="controls">
    <button id="clearMaskBtn">Clear Mask</button>
    <button id="downloadMaskBtn">Download Mask</button>
    <button id="cleanImageBtn">Clean Image</button>
  </div>
</div>

<!-- VIDEO PANEL -->
<div id="videoPanel" class="hidden">
  <input type="file" id="vidFile" accept="video/*">
  <video id="vidPreview" controls></video>
  <button id="captureFrameBtn">Capture Frame</button>
  <canvas id="vidCanvas" class="canvas"></canvas>
  <div class="controls">
    <button id="clearVidMaskBtn">Clear Mask</button>
    <button id="cleanVideoBtn">Clean Video</button>
  </div>
</div>

<footer>Made with ❤️ — DML Tools</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
